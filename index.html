<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKant ERPNext Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --page-bg:#ffffff;
  --fill:#f4f5f6;           /* control background */
  --fill-hover:#ebeef0;
  --border:#e2e6e9;
  --border-light:#ebeef0;
  --text:#1f272e;
  --text-light:#525b64;
  --muted:#8d99a6;
  --black:#171717;
  --blue:#2563eb;
  --blue-soft:#eff4ff;
  --blue-border:#c9dbff;
  --amber:#b45309;
  --amber-bg:#fef3c7;
  --green:#15803d;
  --green-bg:#dcfce7;
  --red:#b91c1c;
  --red-bg:#fee2e2;
  --purple:#6d28d9;
  --purple-bg:#f3e8ff;
  --grey-bg:#f0f2f4;
  --radius:8px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --nav-h:48px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  color-scheme:light;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
svg{display:block}
.i{width:14px;height:14px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:12px;height:12px}
.i-lg{width:16px;height:16px}

/* ---------- demo banner ---------- */
.demobar{background:#1f272e;color:#fff;font-size:11.5px;padding:7px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.demobar b{font-weight:600}
.demobar span.dot{opacity:.4}
.demobar .legend{display:inline-flex;align-items:center;gap:5px}
.demobar .chip{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1.5px 5px;border-radius:4px;background:var(--purple-bg);color:var(--purple);text-transform:uppercase}

/* ---------- navbar ---------- */
.navbar{
  height:var(--nav-h); background:#fff; border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;gap:10px;padding:0 14px;position:sticky;top:0;z-index:60;
}
.logo{width:24px;height:24px;border-radius:7px;background:var(--black);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.crumbs{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--text-light);min-width:0;overflow:hidden}
.crumbs a{white-space:nowrap;padding:2px 4px;border-radius:4px}
.crumbs a:hover{background:var(--fill);color:var(--text)}
.crumbs .sep{color:var(--muted);opacity:.7}
.crumbs .cur{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navright{margin-left:auto;display:flex;align-items:center;gap:6px}
.navsearch{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:var(--radius-sm);padding:5px 9px;color:var(--muted);width:190px;font-size:12.5px}
.navsearch input{border:0;background:transparent;outline:none;font-family:inherit;font-size:12.5px;width:100%;color:var(--text)}
.navicon{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-light);background:transparent;border:0}
.navicon:hover{background:var(--fill)}
.avatar{width:24px;height:24px;border-radius:50%;background:#dbe2ea;color:#44525f;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.roleSel{border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:4px 7px;font-size:11.5px;color:var(--text-light);outline:none}

/* ---------- layout ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 14px 70px}
.page-head{display:flex;align-items:center;gap:8px;padding:16px 0 10px;flex-wrap:wrap}
.burger{width:26px;height:26px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--text-light)}
.burger:hover{background:var(--fill)}
.page-title{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
.page-head .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.pill{font-size:10.5px;font-weight:600;padding:2.5px 8px;border-radius:20px;white-space:nowrap}
.pill.draft{background:var(--amber-bg);color:var(--amber)}
.pill.sub{background:var(--blue-soft);color:var(--blue)}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.grey{background:var(--grey-bg);color:var(--text-light)}
.btn{border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:var(--fill)}
.btn.ghost{border-color:transparent;background:var(--fill)}
.btn.ghost:hover{background:var(--fill-hover)}
.btn.icon{padding:5px 7px}
.btn.primary{background:var(--black);border-color:var(--black);color:#fff}
.btn.primary:hover{background:#000}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.blue:hover{filter:brightness(.94)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-light);margin:4px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 11px;font-size:12.5px;font-weight:500;color:var(--muted);border:0;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.tab .cnt{font-size:10.5px;color:var(--muted);margin-left:4px}

/* ---------- form layout ---------- */
.formwrap{display:grid;grid-template-columns:216px 1fr;gap:28px;align-items:start;margin-top:14px}
.formwrap .fside{order:-1}
.formcard{border:1px solid var(--border-light);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);overflow:hidden}
.alertbar{position:relative;background:var(--blue-soft);border:1px solid var(--blue-border);border-radius:var(--radius-sm);padding:9px 30px 9px 11px;font-size:12.5px;color:#1e3a8a;margin-bottom:12px;line-height:1.55}
.alertbar b{font-weight:600}
.alertbar .x{position:absolute;right:9px;top:8px;background:transparent;border:0;color:inherit;opacity:.55;padding:0;line-height:1;font-size:12px}
.alertbar .x:hover{opacity:1}

.sect{border-bottom:1px solid var(--border-light)}
.sect:last-child{border-bottom:0}
.sect-head{display:flex;align-items:center;gap:7px;padding:14px 16px 10px;font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--text);background:transparent;border:0;width:100%;text-align:left}
.sect-head .chev{color:var(--muted)}
.sect-head:hover .chev{color:var(--text)}
.sect-head .chev{transition:transform .15s}
.sect .chev{transform:rotate(180deg)}
.sect.closed .chev{transform:rotate(0deg)}
.sect.closed .sect-body{display:none}
.sect-body{padding:2px 16px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 34px}
.grid1{display:grid;grid-template-columns:1fr;gap:4px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

.field{padding:7px 0 9px;min-width:0}
.flabel{font-size:11.5px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:5px}
.flabel .req{color:var(--red)}
.cf{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--purple-bg);color:var(--purple);padding:1px 4px;border-radius:3px}
.ctrl{background:var(--fill);border:1px solid transparent;border-radius:var(--radius-sm);padding:6px 9px;font-size:12.5px;color:var(--text);min-height:30px;display:flex;align-items:center;gap:6px;transition:border-color .12s,background .12s}
.ctrl:hover{border-color:var(--border)}
.ctrl:focus-within{background:#fff;border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
.ctrl select{appearance:none;-webkit-appearance:none}
.ctrl input,.ctrl textarea,.ctrl select{border:0;background:transparent;outline:none;font-family:inherit;font-size:12.5px;color:var(--text);width:100%;padding:0;resize:vertical}
.ctrl textarea{min-height:52px;line-height:1.55}
.ctrl.ro{background:var(--fill);color:var(--text-light)}
.ctrl.ro:hover{border-color:transparent}
.ctrl .lk{color:var(--blue);font-weight:500}
.ctrl .unit{color:var(--muted);font-size:11.5px}
.ctrl .lock{margin-left:auto;color:var(--muted)}
.fhint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
.check{display:flex;align-items:center;gap:7px;padding:9px 0;font-size:12.5px}
.check input{width:14px;height:14px;accent-color:var(--blue);margin:0}

/* ---------- form sidebar ---------- */
.fside{font-size:12px}
.fside .blk{padding:3px 0}
.fside .ttl{display:flex;align-items:center;gap:7px;color:var(--text);font-size:12.5px;padding:5px 0}
.fside .ttl .sp{margin-left:auto}
.fside .ttl svg{color:var(--text-light);flex:0 0 auto}
.fside .add{width:18px;height:18px;border-radius:4px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.fside .add:hover{background:var(--fill);color:var(--text)}
.fside .val{color:var(--text-light);font-size:12px}
.fside .avrow{display:flex;gap:-4px;align-items:center}
.fside .avrow .avatar{width:22px;height:22px;margin-right:-5px;border:2px solid #fff}
.fside .meta{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:11.5px;padding:14px 0 10px;margin-top:10px;border-top:1px solid var(--border-light)}
.fside .meta button{border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;gap:4px;padding:0;font-size:11.5px}
.fside .meta button:hover{color:var(--text)}
.fside .edited{color:var(--muted);font-size:11.5px;padding-top:4px;line-height:1.6}
.fside .edited div{margin-bottom:9px}
.fside .edited b{color:var(--text-light);font-weight:500}

/* ---------- connections ---------- */
.conns{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{background:var(--fill);border-radius:var(--radius-sm);padding:6px 12px;font-size:12.5px;text-decoration:underline;text-underline-offset:2px;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.chips a:hover{background:var(--fill-hover)}
.chips a .num{background:#fff;border-radius:10px;font-size:10.5px;padding:0 6px;color:var(--text-light);font-weight:600;text-decoration:none}
.conn .cn-h{font-size:12px;font-weight:600;margin-bottom:6px}
.conn .cn-l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-light);padding:3px 0}
.conn .cn-l .num{background:var(--fill);border-radius:10px;font-size:10.5px;padding:0 6px;color:var(--text-light);font-weight:500}
.conn .cn-l a{color:var(--blue)}
.conn .cn-l a:hover{text-decoration:underline}

/* ---------- grid (child table) ---------- */
.gridbox{border:1px solid var(--border-light);border-radius:var(--radius-sm);overflow:hidden;background:#fff}
.gtbl{width:100%;border-collapse:collapse;font-size:12px}
.gtbl th{background:var(--fill);color:var(--muted);font-size:11px;font-weight:600;text-align:left;padding:7px 9px;border-bottom:1px solid var(--border-light);white-space:nowrap}
.gtbl th.n,.gtbl td.n{width:34px;text-align:center;color:var(--muted)}
.gtbl th.x,.gtbl td.x{width:30px}
.gtbl td{padding:7px 9px;border-bottom:1px solid var(--border-light);vertical-align:middle}
.gtbl tr:last-child td{border-bottom:0}
.gtbl tbody tr:hover{background:#fafbfc}
.gtbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.gtbl .exp{opacity:0;border:0;background:transparent;color:var(--muted);padding:0}
.gtbl tr:hover .exp{opacity:1}
.gridfoot{padding:7px 9px;border-top:1px solid var(--border-light);background:#fff}
.addrow{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:500;padding:0;display:inline-flex;align-items:center;gap:4px}
.rowdetail{background:#fbfcfd}
.rowdetail td{padding:12px 14px}
.rd-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:8px}
.rd-h .idx{background:var(--fill);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--text-light)}

/* ---------- list view ---------- */
.listwrap{display:grid;grid-template-columns:1fr 196px;gap:26px;align-items:start;margin-top:12px}
.listbar{display:flex;align-items:center;gap:8px;padding:9px 0;flex-wrap:wrap}
.filterbox{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:var(--radius-sm);padding:5px 9px;color:var(--muted);font-size:12px;min-width:170px}
.filterbox input{border:0;background:transparent;outline:none;font-family:inherit;font-size:12px;width:100%;color:var(--text)}
.listbox{border:1px solid var(--border-light);border-radius:var(--radius);overflow:hidden;background:#fff}
.lhead{display:flex;align-items:center;gap:10px;padding:8px 13px;background:var(--fill);border-bottom:1px solid var(--border-light);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border-light);font-size:12.5px}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:#fafbfc}
.lrow input[type=checkbox]{accent-color:var(--blue);margin:0}
.lrow .main{min-width:0;flex:1}
.lrow .nm{font-weight:500;color:var(--text);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm:hover{color:var(--blue)}
.lrow .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.lrow .rgt{margin-left:auto;display:flex;align-items:center;gap:9px;flex:0 0 auto}
.lrow .when{color:var(--muted);font-size:11px;white-space:nowrap}
.ind{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-light);white-space:nowrap}
.ind::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.ind.g{color:var(--green)}.ind.a{color:var(--amber)}.ind.r{color:var(--red)}.ind.b{color:var(--blue)}.ind.m{color:var(--muted)}
.lside .ttl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 7px}
.lside .f{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-light);padding:4px 0}
.lside .f:hover{color:var(--blue)}
.lside .f .n{color:var(--muted);font-size:11px}
@media(max-width:900px){.formwrap,.listwrap{grid-template-columns:1fr}.fside,.lside{order:-1}}

/* ---------- comments ---------- */
.cmt{margin-top:22px;max-width:100%}
.cmt-tabs{display:flex;gap:14px;border-bottom:1px solid var(--border-light);margin-bottom:12px}
.cmt-tabs button{border:0;background:transparent;padding:7px 0;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.cmt-tabs button.on{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.cmt-box{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;color:var(--muted);font-size:12.5px;background:#fff}
.cmt-item{display:flex;gap:9px;padding:11px 0;border-bottom:1px solid var(--border-light)}
.cmt-item:last-child{border-bottom:0}
.cmt-item .bd{min-width:0}
.cmt-item .who{font-size:12px;font-weight:600}
.cmt-item .who span{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.cmt-item .tx{font-size:12.5px;color:var(--text-light);margin-top:3px;line-height:1.55}

/* ---------- workspace ---------- */
.ws-h{font-size:13px;font-weight:600;margin:24px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:11px}
.scut{border:1px solid var(--border-light);border-radius:var(--radius);padding:12px 13px;background:#fff;display:block;box-shadow:var(--shadow)}
.scut:hover{border-color:var(--border);background:#fafbfc}
.scut .t{font-size:12.5px;font-weight:600}
.scut .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.lcard{border:1px solid var(--border-light);border-radius:var(--radius);background:#fff;padding:13px 15px;box-shadow:var(--shadow)}
.lcard .h{font-size:12.5px;font-weight:600;margin-bottom:8px}
.lcard .l{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-light);padding:4px 0}
.lcard .l:hover{color:var(--blue)}
.lcard .l .cf{margin-left:auto}
.nc{border:1px solid var(--border-light);border-radius:var(--radius);background:#fff;padding:13px 15px;box-shadow:var(--shadow)}
.nc .lab{font-size:11.5px;color:var(--muted)}
.nc .v{font-size:21px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.nc .d{font-size:11px;color:var(--muted);margin-top:3px}

/* ---------- misc ---------- */
.note{border:1px solid var(--blue-border);background:var(--blue-soft);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:#1e3a8a;line-height:1.55;margin:12px 0}
.note b{font-weight:600}
.warn{border:1px solid #fcd34d;background:#fffbeb;border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:#92400e;line-height:1.55;margin:12px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--black);color:#fff;font-size:12.5px;padding:10px 15px;border-radius:var(--radius-sm);box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.2s;max-width:88vw;z-index:200}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dtbl{width:100%;border-collapse:collapse;font-size:12px;border:1px solid var(--border-light);border-radius:var(--radius);overflow:hidden}
.dtbl th{background:var(--fill);color:var(--muted);font-size:11px;font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-light)}
.dtbl td{padding:8px 10px;border-bottom:1px solid var(--border-light);vertical-align:top}
.dtbl tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.bar{display:grid;grid-template-columns:96px 1fr 38px;gap:9px;align-items:center;margin-bottom:7px;font-size:11.5px}
.bar .nm{color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--grey-bg);gap:2px}
.bar .tr i{display:block;height:100%;border-radius:2px}
.bar .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
a.nc{display:block}
a.nc:hover,a.scut:hover{border-color:var(--border)}
.gtbl tfoot td{padding:7px 9px;border-top:1px solid var(--border-light)}
.listbox .empty{padding:44px 16px}

</style>
</head>
<body>
<div class="demobar">
  <b>Demo only</b><span class="dot">·</span>
  <span>A stand-in for the SKant ERPNext instance — clicking around is safe, nothing is saved</span><span class="dot">·</span>
  <span class="legend"><span class="chip">custom</span> marks what is NOT stock ERPNext</span>
</div>

<div class="navbar">
  <div class="logo">F</div>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="navright">
    <div class="navsearch"><svg class="i i-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input placeholder="Search or type a command"></div>
    <select class="roleSel" id="role">
      <option value="pm">Priya Raghavan · Project Manager</option>
      <option value="lead">Rajesh Menon · PM Lead</option>
      <option value="fin">A. Banerjee · Finance</option>
    </select>
    <button class="navicon" title="Notifications"><svg class="i i-lg" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg></button>

const PTABS=[['details','Details'],['ms','Milestones'],['budget','Budget'],['exp','Expenses'],['rev','Revisions'],['conn','Connections']];
function vProduct(id, tab){
  const p=prod(id); if(!p) return vProductList();
  tab=tab||'details';
  crumbs([['Home','#/'],['Product','#/list/product'],[p.id]]);
  const pend=DB.drr.filter(d=>d.product===p.id&&d.state.startsWith('Pending'));
  const pill = p.tbc?['Draft','draft']:['Submitted','sub'];
  const banner = p.tbc
    ? `<div class="alertbar"><b>Draft</b> · This came in as an enquiry. No dosage form, so no stage template can be applied and no baseline can be frozen. It shows on the dashboard as <b>unplanned</b> rather than being invisible.<button class="x" onclick="this.parentNode.remove()">✕</button></div>`
    : `<div class="alertbar"><b>Submitted</b> · Baseline: ${esc(p.baseline)}. Planned milestone dates are locked at <span class="mono">permlevel 1</span> and can only move through a <a href="#/list/drr" style="color:#1d4ed8;font-weight:600">Deadline Revision Request</a>.<button class="x" onclick="this.parentNode.remove()">✕</button></div>`;
  const counts={details:'',ms:p.total||'',budget:p.id==='PROD-0007'?DB.budget.lines.length:'',exp:p.tbc?'':118,rev:p.revisions||'',conn:''};
  const body = tab==='ms'?bMs(p) : tab==='budget'?bBudget(p) : tab==='exp'?bExp(p) : tab==='rev'?bRev(p) : tab==='conn'?sect('Connections',connBody(p)) : bDetails(p);
  return head(p.id, pill, `${p.overdue?`<span class="pill red">${p.overdue} stage overdue</span>`:''}${pend.length?`<span class="pill draft">${pend.length} revision pending</span>`:''}<button class="btn">Edit</button>`) + `
  <div class="tabs">${PTABS.map(t=>`<a class="tab${t[0]===tab?' on':''}" href="#/form/product/${p.id}/${t[0]}">${t[1]}${counts[t[0]]?`<span class="cnt">${counts[t[0]]}</span>`:''}</a>`).join('')}</div>
  <div class="formwrap">
    <div>${banner}
      ${util(p)>100?`<div class="warn"><b>Budget exceeded.</b> ${L(p.spent)} spent against ${L(p.budget)} budgeted — ${util(p).toFixed(1)}%. Utilisation is measured against the <b>cost</b> column, never against sell.</div>`:''}
      <div class="formcard">${p.tbc?'':connTop(p)}${body}</div>
      ${comments(p.tbc
        ? [['Priya Raghavan','PR','4 days ago','Customer has only asked for an indicative price. Holding this as an enquiry until the dosage form is confirmed.']]
        : [['Priya Raghavan','PR','today 08:02','Raised DRR-00041 for the 6M stability pull. Chamber requalification report is attached to the request.'],
           ['A. Banerjee','AB','2 days ago','Two at-actuals rows on the budget are still unbilled. They are held out of the utilisation figure, as agreed.']])}
    </div>
    ${fside({assigned:p.tbc?[]:[[p.pm,p.pmi],[p.lead,p.leadi]], attach:p.tbc?'':'phase_wise_quote.xlsx',
      tags:p.tbc?['enquiry']:[p.mkt.split(' (')[0], p.form], likes:0, comments:p.tbc?1:2,
      edited:`<div>${esc(p.pm)} last edited this · ${p.tbc?'4 days ago':'today'}</div>`, created:p.tbc?'4 days ago':'14 Jul 2026'})}
  </div>`;
}

/* ---------- Milestones ---------- */
function msInd(s,n){
  return s==='Done'?'<span class="ind g">Done</span>'

}
function bMs(p){
  if(!p.ms.length) return sect('Milestones', `<div class="empty">No stage template applied. Set a dosage form on the Details tab and the stages are created from the <b>Stage Template</b>.</div>`, {custom:true});
  const from=Math.max(0,p.live-7);
  const rows=p.ms.slice(from).map(m=>{
    const moved = +m.planned !== +m.baseline;
    return `<tr>
      <td class="n">${m.n}</td>
      <td>${m.state==='Overdue'?'<b>'+esc(m.name)+'</b>':esc(m.name)}</td>
      <td>${esc(m.dept)}</td>
      <td>${D(m.planned)}${moved?' <span class="cf" style="background:var(--amber-bg);color:var(--amber)">moved</span>':''}</td>
      <td>${m.actual?D(m.actual):'<span style="color:var(--muted)">—</span>'}</td>
      <td>${msInd(m.state,m.n)}</td>
      <td>${esc(m.by)||'<span style="color:var(--muted)">—</span>'}</td>
      <td class="x"><button class="exp" onclick="toggleRow(this)" title="Open row">${I.edit}</button></td></tr>
    <tr class="rowdetail" style="display:none"><td colspan="8">
      <div class="rd-h"><span class="idx">Row ${m.n}</span> ${esc(m.name)}</div>
      <div class="grid2">
        ${fld('Stage',m.name,{ro:true})}
        ${fld('Owner Department',m.dept,{select:DEPTS, custom:true})}
        ${fld('Planned Date',D(m.planned),{ro:true, lock:true, perm:true, custom:true,
          hint:'Locked. A Frappe Workflow approves a <b>document</b> moving between states — it cannot approve one field quietly changing value, which is exactly why the revision request is its own DocType.'})}
        ${fld('Baseline Date',D(m.baseline),{ro:true, lock:true, custom:true, hint:moved?'Original date. Moved '+Math.round((m.planned-m.baseline)/864e5)+' days by an approved revision.':''})}
        ${fld('Actual Completion',m.actual?D(m.actual):'',{date:true})}
        ${fld('Status',m.state,{select:['Not started','In progress','Blocked','Overdue','Done']})}
      </div>
      ${m.state!=='Done'?`<div style="margin-top:10px"><a class="btn blue" href="#/form/drr/DRR-00041">Request date change</a></div>`:''}
    </td></tr>`;}).join('');
  return sect('Milestones', `
    <div class="gridbox"><table class="gtbl">
      <thead><tr><th class="n">#</th><th>Stage</th><th>Dept</th><th>Planned</th><th>Actual</th><th>Status</th><th>Signed off</th><th class="x"></th></tr></thead>

}

/* ---------- Budget ---------- */
function bBudget(p){
  if(p.id!=='PROD-0007') return sect('Project Budget', `<div class="empty">Budget document for ${esc(p.id)} is not loaded in this demo. Open <a href="#/form/product/PROD-0007/budget" style="color:var(--blue)">PROD-0007</a> to see the full table.</div>`, {custom:true});
  const b=DB.budget;
  const tot=b.lines.reduce((a,l)=>a+(l[3]||0),0);
  const sp =b.lines.reduce((a,l)=>a+l[5],0);
  const act=b.lines.filter(l=>l[3]===null).reduce((a,l)=>a+l[5],0);
  const rows=b.lines.map((l,i)=>{
    const at=l[3]===null, u=at?null:l[5]/l[3]*100;
    return `<tr${at?' style="background:#fffbeb"':''}>
      <td class="n">${i+1}</td><td>${esc(l[0])}</td>
      <td>${esc(l[1])}${at?' <span class="pill draft" style="margin-left:4px">at actuals</span>':''}</td>
      <td>${esc(l[2])}</td>
      <td class="num">${at?'—':L(l[3])}</td>
      <td class="num">${at?'<span style="color:var(--muted)">at cost</span>':L(l[4])}</td>
      <td class="num">${L(l[5])}</td>
      <td class="num"${u>100?' style="color:var(--red);font-weight:600"':''}>${at?'<span style="color:var(--muted)">n/a</span>':u.toFixed(0)+' %'}</td>
      <td class="x"><button class="exp" onclick="toggleRow(this)">${I.edit}</button></td></tr>
    <tr class="rowdetail" style="display:none"><td colspan="9">
      <div class="rd-h"><span class="idx">Row ${i+1}</span> ${esc(l[1])}</div>
      <div class="grid2">
        ${fld('Phase',l[0],{custom:true, select:['Development','Analytical','Exhibit','Stability','Regulatory','Logistics']})}
        ${fld('Cost Head',l[1],{req:true, custom:true})}
        ${fld('Department',l[2],{select:DEPTS, custom:true})}
        ${fld('Cost',at?'':L(l[3]),{custom:true, hint:at?'Left blank on purpose. A blank cost makes this an <b>at actuals</b> line, held out of the utilisation percentage.':''})}
        ${fld('Sell',at?'':L(l[4]),{custom:true, hint:at?'Passed through at cost. No margin is taken.':''})}
        ${fld('Spent',L(l[5]),{ro:true, lock:true, custom:true, hint:'Rolled up from Expense Allocation. Never typed.'})}
      </div></td></tr>`;}).join('');
  return sect('Budget Document', `<div class="grid2">
      ${fld('Budget',b.id,{ro:true, link:true})}
      ${fld('Version',`v${b.version}`,{ro:true, custom:true})}
      ${fld('Source',b.source,{ro:true, custom:true})}
      ${fld('Approved By',b.approved,{ro:true, link:true})}
      ${fld('Currency','INR',{ro:true})}
      ${fld('FX Rate Used',b.fx,{ro:true, custom:true, hint:'Stored on the document, so a later rate change does not silently restate an approved budget.'})}
    </div>`, {custom:true})
  + sect('Budget Lines', `
    <div class="gridbox"><table class="gtbl">
      <thead><tr><th class="n">#</th><th>Phase</th><th>Cost Head</th><th>Dept</th><th style="text-align:right">Cost</th><th style="text-align:right">Sell</th><th style="text-align:right">Spent</th><th style="text-align:right">Used</th><th class="x"></th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr style="background:var(--fill);font-weight:600">
        <td class="n"></td><td colspan="3">Total, excluding at actuals</td>
        <td class="num">${L(tot)}</td><td class="num"></td><td class="num">${L(sp-act)}</td>
        <td class="num" style="color:var(--amber)">${((sp-act)/tot*100).toFixed(1)} %</td><td class="x"></td></tr>
        <tr><td class="n"></td><td colspan="3" style="color:var(--muted)">At actuals, shown separately</td>
        <td class="num">—</td><td class="num"></td><td class="num">${L(act)}</td><td class="num">—</td><td class="x"></td></tr>
      </tfoot></table>
      <div class="gridfoot"><button class="addrow">${I.plus} Add Row</button></div>
    </div>
    <div class="fhint" style="margin-top:8px"><b>Two decisions are baked into this table.</b> Utilisation is measured against the Cost column, not Sell — against Sell it would read 62% and every product would look healthy. Rows 9 and 10 carry no cost figure, so they are at actuals and are held out of the percentage rather than quietly inflating it.</div>`, {custom:true});
}

      </div>
      <div class="listbox">
        <div class="lhead"><input type="checkbox"><span>Request</span><span style="margin-left:auto">Workflow State</span></div>
        ${DB.drr.map(d=>{const p=prod(d.product);
          return `<div class="lrow"><input type="checkbox">
            <div class="main"><a class="nm" href="#/form/drr/${d.id}">${d.id} — ${esc(p.name)}, stage ${d.stage}</a>
              <div class="sub">${esc(d.dept)} · ${esc(d.from)} → ${esc(d.to)} · ${d.days} days</div></div>
            <div class="rgt">${drrInd(d.state)}<div class="avatar" title="${esc(d.by)}">${esc(d.byi)}</div><span class="when">${esc(d.at)}</span></div>
          </div>`;}).join('')}
      </div>
      <div class="note"><b>This DocType does not exist in ERPNext — we build it.</b> Frappe's workflow engine approves a document moving between states; it cannot approve one field quietly changing value. So the planned date is locked at <span class="mono">permlevel 1</span> and this document carries the change, writing it back only once the PM Lead approves. It is the most under-scoped item in Scope v1.1.</div>
    </div>
    <aside class="lside">
      <div class="ttl">Filter By</div><div class="f">Assigned To <span class="n">1</span></div><div class="f">Created By <span class="n">2</span></div>
      <div class="ttl">Edit Filters</div><div class="f">Workflow State <span class="n">${pend?4:3}</span></div><div class="f">Product <span class="n">2</span></div><div class="f">Owner Dept <span class="n">3</span></div>
      <div class="ttl">Save Filter</div><div class="f" style="color:var(--muted)">Filter name…</div>
    </aside>
  </div>`;
}

function vDrr(id){
  const d=DB.drr.find(x=>x.id===id); if(!d) return vDrrList();
  const p=prod(d.product);
  crumbs([['Home','#/'],['Deadline Revision Request','#/list/drr'],[d.id]]);
  const canAct = isLead() && d.state==='Pending PM Lead';
  const pillMap={'Draft':['Draft','draft'],'Pending PM Lead':['Pending PM Lead','sub'],'Approved':['Approved','ok'],'Applied':['Applied','ok'],'Rejected':['Rejected','red']};
  const shift=p.total-d.stage;
  const breach=p.contract && pd(p.forecast)>pd(p.contract);

  let actions='';
  if(d.state==='Pending PM Lead') actions = canAct
    ? `<button class="btn" onclick="reject('${d.id}')">Reject</button><button class="btn blue" onclick="approve('${d.id}')">Approve</button>`
    : `<button class="btn" disabled title="Only the PM Lead can approve">Approve</button>`;

  const banner = d.state==='Pending PM Lead'
    ? `<div class="alertbar"><b>Pending PM Lead</b> · ${canAct
        ? 'You are the approver. Approving writes the new date onto the milestone, bumps the revision count and moves the forecast filing date.'
        : 'Waiting on <b>'+esc(p.lead)+'</b>. You raised this, so you cannot approve it — self-approval is turned off on this workflow. Switch role in the top bar to see the approver’s view.'}<button class="x" onclick="this.parentNode.remove()">✕</button></div>`
    : d.state==='Applied'||d.state==='Approved'
      ? `<div class="alertbar" style="background:var(--green-bg);border-color:#86efac;color:#14532d"><b>${esc(d.state)}</b> · The new planned date has been written back to the milestone and the forecast filing date recalculated.<button class="x" style="color:#14532d" onclick="this.parentNode.remove()">✕</button></div>`
      : `<div class="alertbar" style="background:var(--red-bg);border-color:#fca5a5;color:#7f1d1d"><b>Rejected</b> · The milestone date is unchanged. The rejection stays on the product record.<button class="x" style="color:#7f1d1d" onclick="this.parentNode.remove()">✕</button></div>`;

  return head(d.id, pillMap[d.state], actions) + `
  <div class="formwrap">
    <div>${banner}
      <div class="formcard">
        ${sect('What is being asked', `<div class="grid2">
          ${fld('Product',p.name,{req:true, link:true, ro:true})}
          ${fld('Stage',`${d.stage}. ${p.ms[d.stage-1].name}`,{req:true, ro:true})}
          ${fld('Owner Department',d.dept,{ro:true})}
          ${fld('Current Planned Date',d.from,{ro:true, lock:true})}
          ${fld('Requested New Date',d.to,{req:true, date:true, ro:d.state!=='Draft', lock:d.state!=='Draft'})}
          ${fld('Days Shifted',String(d.days),{ro:true, unit:'days', hint:'Calculated from the two dates, not typed.'})}
        </div>`, {custom:true})}
        ${sect('Reason', `<div class="grid1">
          ${fld('Reason',d.reason,{req:true, area:true, custom:true, hint:'Mandatory. The document cannot be submitted without it. This is the sentence that ends up in the audit trail.'})}
        </div>`, {custom:true})}
        ${sect(d.state==='Applied'?'What this changed':'Impact if approved', `
          <div class="gridbox"><table class="gtbl">
            <thead><tr><th>Effect</th><th>Before</th><th>After</th></tr></thead>
            <tbody>
              <tr><td>Stages that shift</td><td>—</td><td><b>${shift}</b> downstream of stage ${d.stage}</td></tr>
              <tr><td>Forecast filing date</td><td>${esc(p.target)}</td><td><b>${esc(p.forecast)}</b></td></tr>
              <tr><td>Revision count</td><td>${d.state==='Applied'?p.revisions-1:p.revisions}</td><td><b>${d.state==='Applied'?p.revisions:p.revisions+1}</b></td></tr>
              <tr><td>Customer commitment</td><td>Contract date ${esc(p.contract)}</td><td>${breach?'<b style="color:var(--red)">Breached</b>':'<span class="ind g">Holds</span>'}</td></tr>
            </tbody></table></div>
          <div class="fhint" style="margin-top:8px">Computed on the document, so the approver decides with the consequence in front of them rather than after the fact.</div>`, {custom:true})}
        ${sect('Trail', `<div class="grid2">
          ${fld('Raised By',`${d.by}, ${d.at}`,{ro:true, link:true})}
          ${fld('Approver',`${p.lead}, PM Lead`,{ro:true, link:true})}
          ${fld('Workflow State',d.state,{ro:true, lock:true})}
          ${fld('Self approval allowed',false,{check:true})}
        </div>`)}
      </div>
      ${d.state==='Pending PM Lead'?`<div class="note"><b>The bit worth watching.</b> Switch the role in the top bar to <b>Rajesh Menon · PM Lead</b> and press Approve. The planned date on the milestone row changes, the revision count on the product goes up by one, and the forecast filing date moves. That write-back is the entire reason this DocType exists.</div>`:''}
      ${comments([[d.by,d.byi,d.at,'Raised with the supporting report attached. Please review before the customer call on Friday.'],
                  [p.lead,p.leadi,'1 hour ago','Checking whether the downstream stages can absorb any of this before I approve.']])}
    </div>
    ${fside({assigned:[[p.lead,p.leadi]], attach:'chamber_requalification.pdf', tags:['deadline','stage-'+d.stage,d.dept], likes:0, comments:2,
             edited:`<div>${esc(d.by)} last edited this · ${esc(d.at)}</div>`, created:esc(d.at)})}
  </div>`;
}

function approve(id){
  const d=DB.drr.find(x=>x.id===id), p=prod(d.product), m=p.ms[d.stage-1];
  d.state='Applied';
  m.planned = pd(d.to) || m.planned;
  if(m.state==='Overdue') m.state='Not started';
  const nxt=p.ms[d.stage]; if(nxt && nxt.state==='Blocked') nxt.state='Not started';
  p.revisions += 1;
  p.overdue = Math.max(0, p.overdue-1);
  go('#/form/product/'+p.id+'/ms');
  toast('Approved. Planned date on stage '+d.stage+' rewritten to '+d.to+', revision count now '+p.revisions+', forecast filing date '+p.forecast+'.');
}
function reject(id){
  const d=DB.drr.find(x=>x.id===id);
  d.state='Rejected';
  render();
  toast('Rejected. The milestone date is unchanged and the rejection stays on the product record.');
}

/* ============================== EXPENSE QUEUE ============================== */
function vQueue(){
  crumbs([['Home','#/'],['Project and Budget','#/'],['Expense Allocation']]);
  const tot=DB.expenses.reduce((a,e)=>a+e.val,0);
  const body = DB.expenses.length ? `
    <div class="listbox">
      <div class="lhead"><input type="checkbox"><span>Source document</span><span style="margin-left:auto">Best guess</span></div>
      ${DB.expenses.map(e=>`<div class="lrow"><input type="checkbox">
        <div class="main"><span class="nm">${esc(e.id)} — ${esc(e.vendor)}</span>
          <div class="sub">${esc(e.date)} · ${esc(e.note)} · ${L(e.val)}</div></div>
        <div class="rgt">
          ${e.layer?`<span class="ind a">Layer ${e.layer}, ${e.conf}%</span>`:'<span class="ind m">No match</span>'}
          <span class="when">${esc(e.guess)}</span>
          <button class="btn" style="padding:3px 8px;font-size:11.5px" onclick="assign('${e.id}')">${e.layer?'Assign':'Send to Finance'}</button>
        </div></div>`).join('')}
    </div>
    <div style="font-size:11.5px;color:var(--muted);padding:10px 2px">${DB.expenses.length} rows, ${L(tot)}</div>`
  : `<div class="listbox"><div class="empty" style="padding:44px">
      <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px">Queue is clear</div>
      Every row loaded so far has been attached to a product and a cost head.<br>This is what twenty minutes a week buys.
      <div style="margin-top:14px"><button class="btn" onclick="resetQ()">Reset the demo queue</button></div></div></div>`;
  return head('Expense Allocation', ['Review queue','grey'], `<button class="btn ghost">${I.filter} Filter</button><button class="btn">Export</button><button class="btn blue" onclick="assignAll()">Assign all suggested</button>`) + `
  ${DB.expenses.length?`<div class="warn"><b>${DB.expenses.length} rows could not be attributed automatically.</b> Nobody owns this queue in Scope v1.1. Left unowned, this cost never reaches a budget head and utilisation quietly under-reports.</div>`:''}
  <div class="listwrap">
    <div>
      <div class="listbar"><div class="filterbox">${I.search}<input placeholder="Reference"></div>
        <button class="btn ghost">Status: Unmatched ${I.down}</button><button class="btn ghost">Sorted by value ${I.down}</button></div>
      ${body}
      <div class="note"><b>This screen is the product, not a tile.</b> Cleared weekly, the budget half of the dashboard stays trusted. Let it grow and people stop believing the utilisation numbers — and then they stop believing the whole screen.</div>
    </div>
    <aside class="lside">
      <div class="ttl">Filter By</div><div class="f">Source <span class="n">3</span></div><div class="f">Status <span class="n">2</span></div>
      <div class="ttl">Edit Filters</div><div class="f">Matching Layer <span class="n">3</span></div><div class="f">Vendor <span class="n">4</span></div><div class="f">Upload Batch <span class="n">6</span></div>
    </aside>
  </div>`;
}
function assign(id){
  const e=DB.expenses.find(x=>x.id===id); const was=e.layer;
  DB.expenses=DB.expenses.filter(x=>x.id!==id);
  render();
  toast(was?('Allocated to '+e.guess+' on a layer '+was+' match. Budget utilisation recalculated.')
           :(e.id+' sent to Finance to split across the three products it covers.'));
}
function assignAll(){
  const n=DB.expenses.filter(e=>e.layer).length;
  DB.expenses=DB.expenses.filter(e=>!e.layer);
  render();
  toast(n+' rows allocated on their suggested match. Anything with no match stays for a human.');
}
function resetQ(){ location.reload(); }

/* ============================== SPEND UPLOAD ============================== */
function vUpload(){
  crumbs([['Home','#/'],['Project and Budget','#/'],['Spend Upload']]);
  return head('Spend Upload', ['Today’s file processed','ok'], `<button class="btn">View log</button>`) + `
  <div class="formwrap">
    <div>
      <div class="alertbar"><b>Last run</b> · 06:04 today · 312 rows read, 46 duplicates skipped, 262 matched, 4 sent to review.<button class="x" onclick="this.parentNode.remove()">✕</button></div>
      <div class="formcard">
        ${sect('Source', `<div class="grid2">
          ${fld('Upload Type','PharmaCloud BI export',{ro:true, custom:true})}
          ${fld('Files','PR register, PO register, booked invoices',{ro:true, custom:true, hint:'Three exports, dropped in together. CSV or XLSX. Files are read as they are and never edited.'})}
          ${fld('Frequency','Weekly',{select:['Weekly','Fortnightly','Monthly'], custom:true})}
          ${fld('Duplicate Key','Source document number + line number',{ro:true, custom:true, hint:'Why re-uploading last week’s file does not double count.'})}
        </div>`, {custom:true})}
        ${sect('What happened to this file', `
          <div class="gridbox"><table class="gtbl">
            <thead><tr><th class="n">#</th><th>Step</th><th style="text-align:right">Rows</th><th>Result</th></tr></thead>
            <tbody>
              <tr><td class="n">1</td><td>Rows read</td><td class="num">312</td><td><span class="ind b">Read</span></td></tr>
              <tr><td class="n">2</td><td>Duplicates skipped</td><td class="num">46</td><td><span class="ind m">Already loaded</span></td></tr>
              <tr><td class="n">3</td><td>Layer 1 — product code on the document</td><td class="num">198</td><td><span class="ind g">Posted</span></td></tr>
              <tr><td class="n">4</td><td>Layer 2 — batch traced through the BOM</td><td class="num">49</td><td><span class="ind g">Posted</span></td></tr>
              <tr><td class="n">5</td><td>Layer 3 — remarks parsed, suggestion only</td><td class="num">15</td><td><span class="ind a">Suggested</span></td></tr>
              <tr><td class="n">6</td><td>Sent to review</td><td class="num">4</td><td><span class="ind r">Needs a human</span></td></tr>
            </tbody></table></div>
          <div class="fhint" style="margin-top:8px">247 of 266 new rows posted without a human, which is 92.9% <b>on this file</b>. The commitment in the scope is 85–90% against live weekly extracts over a quarter. Different measurement, and not one that can be signed off at UAT.</div>`, {custom:true})}
      </div>
      <div class="note">This wraps the standard Frappe <b>Data Import</b>. The custom part is the three-layer matcher and the duplicate key, not the upload box.</div>
    </div>
    ${fside({assigned:[['A. Banerjee','AB']], attach:'pharmacloud_wk41.xlsx', tags:['import','weekly'], likes:0, comments:0,
             edited:'<div>System last updated this · today 06:04</div>', created:'02 Jan 2026'})}
  </div>`;
}

/* ============================== DOCTYPES ============================== */
function vDoctypes(){
  crumbs([['Home','#/'],['DocType reference']]);
  const n=DB.doctypes.filter(d=>d[1]==='New').length;
  return head('DocType reference', null, '') + `
  <div class="note">What the build actually consists of: <b>${n} new DocTypes</b> and <b>${DB.doctypes.length-n} customised</b> stock ones. Every screen in this demo is one of these. Nothing here needs a custom front end.</div>
  <table class="dtbl">
    <thead><tr><th style="width:200px">DocType</th><th style="width:100px">Type</th><th>What it holds</th><th style="width:34%">Why it is like this</th></tr></thead>
    <tbody>${DB.doctypes.map(d=>`<tr>
      <td><b>${esc(d[0])}</b></td>
      <td>${d[1]==='New'?'<span class="pill sub">New</span>':'<span class="pill grey">Customised</span>'}</td>
      <td>${esc(d[2])}</td><td style="color:var(--text-light)">${esc(d[3])}</td></tr>`).join('')}</tbody>
  </table>
  <div class="warn" style="margin-top:16px"><b>Two things to settle before build starts.</b><br>
    1. ERPNext's stock <b>Budget</b> DocType is GL-driven. It cannot hold a cost budget whose spend originates in PharmaCloud, so <b>Project Budget</b> has to be custom.<br>
    2. A Frappe <b>Workflow</b> approves a document, not a field change. Moving a planned milestone date therefore needs its own <b>Deadline Revision Request</b> document, with the planned date locked at permlevel 1 behind it.<br>
    Neither is costed in Scope v1.1.</div>
  <div style="height:30px"></div>`;
}

/* ============================== ROUTER ============================== */
function render(){
  const seg=(location.hash||'#/').replace(/^#/,'').split('/').filter(Boolean);
  let out;
  if(!seg.length) out=vWorkspace();
  else if(seg[0]==='list'&&seg[1]==='product') out=vProductList();
  else if(seg[0]==='list'&&seg[1]==='drr') out=vDrrList();
  else if(seg[0]==='form'&&seg[1]==='product') out=vProduct(seg[2],seg[3]);
  else if(seg[0]==='form'&&seg[1]==='drr') out=vDrr(seg[2]);
  else if(seg[0]==='queue') out=vQueue();
  else if(seg[0]==='upload') out=vUpload();
  else if(seg[0]==='doctypes') out=vDoctypes();
  else out=vWorkspace();
  document.getElementById('app').innerHTML=out;
  window.scrollTo(0,0);
}
const AV={pm:'PR',lead:'RM',fin:'AB'};
document.getElementById('role').addEventListener('change',e=>{
  DB.role=e.target.value;
  document.getElementById('av').textContent=AV[DB.role]||'U';
  render();
  toast(DB.role==='lead'?'Now acting as PM Lead. Approve and Reject are enabled on pending revisions.'
    :DB.role==='fin'?'Now acting as Finance. Budget documents are editable, schedule fields are not.'
    :'Now acting as Project Manager. Approval buttons are hidden — self-approval is off.');
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
